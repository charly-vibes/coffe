# vale — linter de prosa (convención: .vale.ini + .vale/styles como en otros repos)
# Solo el estilo base Vale (Repetition, etc.), que viene built-in en vale 3.x.
# Spelling queda en NO: el diccionario es solo inglés y la prosa acá es español.
StylesPath = .vale/styles

MinAlertLevel = warning

[*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
