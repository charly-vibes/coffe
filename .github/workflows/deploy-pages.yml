# Deploy a GitHub Pages vía Actions (sin branch gh-pages).
#
# Requisito único (una vez, en la UI del repo):
#   Settings → Pages → Build and deployment → Source: **GitHub Actions**
#
# NOTA DE PRIVACIDAD: los reportes contienen costos, nombres de proyecto y
# patrones de actividad personales. Si el repo es público, lo publicado
# también lo es. `index.html` lleva noindex; considera mantener el repo
# privado o filtrar los datos antes de publicar.

name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate Gantt + dashboard + guide from committed data
        run: |
          python3 scripts/viz-gantt.py
          python3 scripts/viz-fpa.py
          python3 scripts/viz_fpa_guide.py
          python3 scripts/viz-index.py

      - name: Doc-consistency check (FPA-143/107)
        run: python3 scripts/viz-fpa.py --check-docs

      - name: Prepare site
        run: |
          mkdir -p _pages
          cp index.html _pages/
          cp -r data _pages/data
          # Los JSON auxiliares no se publican: usage_report_v2.json es SIN
          # filtrar (incluye proyectos no-charly, riesgo de privacidad) y
          # tool_timeline.json es una edición histórica congelada.
          rm -f _pages/data/daily_summary.json _pages/data/usage_hourly.json \
                _pages/data/usage_report_v2.json _pages/data/tool_timeline.json
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - id: deployment
        uses: actions/deploy-pages@v4
